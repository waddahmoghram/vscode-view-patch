# Keep development-tool dependencies and workflow actions on current releases.
# The extension itself has no runtime dependencies.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-tools:
        dependency-type: development
    ignore:
      # The editor-API types floor must equal engines.vscode (the oldest supported
      # editor); vsce package rejects anything newer. Bump it only with the engine.
      - dependency-name: '@types/vscode'
      # Node types track the oldest supported extension host's runtime, not the
      # newest release; majors are a deliberate, tested change.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
