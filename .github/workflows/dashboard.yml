name: Quality dashboard

# Builds the quality dashboard with scripts/quality-dashboard.mjs every day, when run by hand, and after a CI or
# Publish run on main or a release tag finishes. Each run adds a summary to its own page, keeps the built site as
# an artifact, and keeps its dated metrics snapshot for 90 days as the dashboard-metrics artifact, so no daily
# statistics are committed to the repository. The deploy job publishes it to GitHub Pages only when the repository
# variable DASHBOARD_PAGES is `true`; enable Pages with GitHub Actions as its source first (see RELEASING.md).
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [CI, Publish]
    types: [completed]
    # A Publish run for a release tag reports the tag as its branch.
    branches: [main, 'v*.*.*']

permissions:
  contents: read

concurrency:
  group: view-patch-dashboard
  cancel-in-progress: false

jobs:
  build:
    # Never for pull requests: a CI run that a pull request started can still report main as its branch.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # workflow runs, jobs, and job logs
      pull-requests: read # open Dependabot pull requests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The newest metrics snapshot from an earlier UTC day, for the page's changes: three or four requests with
      # this job's token, apart from the script's own budget. Without one the page says it has no previous snapshot.
      - name: Download the previous metrics snapshot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today="$(date -u +%F)"
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=dashboard-metrics&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.created_at[:10] < \"${today}\")]
              | sort_by(.created_at) | last | .workflow_run.id // empty")"
          if [ -z "${run_id}" ]; then
            echo "No unexpired metrics snapshot from before ${today}."
            exit 0
          fi
          gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --name dashboard-metrics --dir .dashboard-history
          ls .dashboard-history
      - name: Build the dashboard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DASHBOARD_HISTORY_DIR: .dashboard-history
        run: node scripts/quality-dashboard.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-metrics
          path: .dashboard/metrics-*.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .dashboard

  deploy:
    needs: build
    if: vars.DASHBOARD_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the site
      id-token: write # prove the deployment's origin to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
