name: Publish

# A version tag (v1.2.3) publishes a release. Running the workflow by hand from main publishes the current version,
# as a pre-release unless that box is cleared. The verify job packages the extension once, with that choice applied,
# and the publish job publishes that exact file. The Marketplace's Trusted Publishing policy must name this file.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      pre_release:
        description: Publish as a pre-release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: view-patch-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      pre_release: ${{ github.event_name == 'workflow_dispatch' && inputs.pre_release }}

  publish:
    needs: verify
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign in to the Marketplace with Trusted Publishing
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      PRE_RELEASE_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.pre_release) && '--pre-release' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        if: github.event_name == 'push'
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi
      - name: Download the package that CI verified
        uses: actions/download-artifact@v8
        with:
          name: view-patch-vsix
      - name: Check the package's channel and record its digest
        run: |
          manifest="$(unzip -p view-patch.vsix extension.vsixmanifest)"
          if grep -q 'Id="Microsoft.VisualStudio.Code.PreRelease" Value="true"' <<< "${manifest}"; then
            packaged=pre-release
          else
            packaged=regular
          fi
          requested=regular
          if [ -n "${PRE_RELEASE_FLAG}" ]; then requested=pre-release; fi
          if [ "${packaged}" != "${requested}" ]; then
            echo "::error::CI packaged a ${packaged} build, but this run publishes ${requested}."
            exit 1
          fi
          digest="$(sha256sum view-patch.vsix | cut -d ' ' -f 1)"
          echo "Publishing view-patch.vsix (${packaged}), SHA-256 ${digest}" | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Publish to the Visual Studio Marketplace
        run: npx vsce publish --oidc ${PRE_RELEASE_FLAG:+"$PRE_RELEASE_FLAG"} --packagePath view-patch.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.4.0 publish view-patch.vsix ${PRE_RELEASE_FLAG:+"$PRE_RELEASE_FLAG"} --pat "${OVSX_PAT}"
      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" view-patch.vsix
          --title "${GITHUB_REF_NAME}"
          --notes "See CHANGELOG.md for what changed."
