name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      pre_release:
        description: Package as a pre-release. The Publish workflow sets this and then publishes this exact package.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode: [stable]
        include:
          # The oldest VS Code that package.json allows.
          - os: ubuntu-latest
            vscode: 1.90.0
    runs-on: ${{ matrix.os }}
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run compile:web
      - run: npm run test:unit
      - name: Unit test coverage report
        if: runner.os == 'Linux' && matrix.vscode == 'stable'
        run: npm run test:unit:coverage
      - name: Integration tests (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration

  test-web:
    name: Web tests (vscode.dev)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run compile:web
      - run: xvfb-run -a npm run test:web

  package:
    needs: test
    runs-on: ubuntu-latest
    env:
      PRE_RELEASE_FLAG: ${{ inputs.pre_release && '--pre-release' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit dependency vulnerabilities
        run: npm audit --include=dev
      - name: Package
        run: npx vsce package ${PRE_RELEASE_FLAG:+"$PRE_RELEASE_FLAG"} --out view-patch.vsix
      - name: Record the package digest
        run: |
          channel=regular
          if [ -n "${PRE_RELEASE_FLAG}" ]; then channel=pre-release; fi
          digest="$(sha256sum view-patch.vsix | cut -d ' ' -f 1)"
          echo "Packaged view-patch.vsix (${channel}), SHA-256 ${digest}" | tee -a "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v7
        with:
          name: view-patch-vsix
          path: view-patch.vsix
